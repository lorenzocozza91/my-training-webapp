<p-menubar [model]="menuItems" class="top-menu">
  <ng-template pTemplate="start">
    <a class="brand" routerLink="/">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        class="brand-logo"
      >
        <path
          d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
        ></path>
      </svg>
      <span class="brand-name">My Training</span>
    </a>
  </ng-template>

  <ng-template pTemplate="item" let-item>
    @switch (item.icon) {
      @case ('dashboard') {
        <svg data-p-icon="home" size="1rem"></svg>
      }
      @case ('training') {
        <svg data-p-icon="bolt" size="1rem"></svg>
      }
      @case ('statistics') {
        <svg data-p-icon="chart-line" size="1rem"></svg>
      }
    }
    <span class="menubar-item-label">{{ item.label }}</span>
  </ng-template>
</p-menubar>

<router-outlet />
